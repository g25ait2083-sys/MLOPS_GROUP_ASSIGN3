# Task 7.1 — Continuous Integration: lint the source on every push to develop
# and on pull requests targeting main. No training happens here (that is Kaggle).
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: flake8 lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install flake8
        run: pip install flake8==7.0.0

      - name: Lint src/
        run: flake8 src/ --max-line-length=120 --statistics
